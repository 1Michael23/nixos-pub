creation_rules:
  # secrets only the framework needs
  - path_regex: ^secrets/framework\.yaml$
    key_groups:
      - age:
          - *framework
          - *admin

  # secrets only the mac needs
  - path_regex: ^secrets/mbp\.yaml$
    key_groups:
      - age:
          - *mbp
          - *admin

  # secrets the proxmox server needs
  - path_regex: ^secrets/proxmox\.yaml$
